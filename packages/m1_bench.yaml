# M1 bench tests (plan step 5). Step 9c deletes this package.
# Address 4 is Playback 1. Physical address 1.0.0.0 is TV HDMI 1.

hdmi_cec:
  id: cec
  pin: GPIO10
  address: 4
  promiscuous_mode: true
  # Start as a listener only: no ACK and no send. The switch below turns it off at runtime.
  monitor_mode: true
  on_message:
    # Give Physical Address to us: Report Physical Address 1.0.0.0, device type Playback.
    # Promiscuous mode also passes frames for other devices, so match the destination too.
    - opcode: 0x83
      destination: 4
      then:
        - hdmi_cec.send:
            destination: 0xF
            data: [0x84, 0x10, 0x00, 0x04]

switch:
  - platform: template
    name: CEC TX soak
    id: cec_tx_soak
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    name: CEC monitor mode
    id: cec_monitor_mode
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lambda: id(cec).set_monitor_mode(true);
    turn_off_action:
      - lambda: id(cec).set_monitor_mode(false);

button:
  - platform: template
    name: CEC Image View On
    on_press:
      - hdmi_cec.send:
          destination: 0x0
          data: [0x04]
  - platform: template
    name: CEC Active Source
    on_press:
      - hdmi_cec.send:
          destination: 0xF
          data: [0x82, 0x10, 0x00]
  - platform: template
    name: CEC Standby to TV
    on_press:
      - hdmi_cec.send:
          destination: 0x0
          data: [0x36]
  - platform: template
    name: CEC Standby broadcast
    on_press:
      - hdmi_cec.send:
          destination: 0xF
          data: [0x36]
  - platform: template
    name: CEC Inactive Source
    on_press:
      - hdmi_cec.send:
          destination: 0x0
          data: [0x9D, 0x10, 0x00]

# Plan step 9a: ACK mask and frame listener tests.
select:
  - platform: template
    name: CEC ACK mask
    id: cec_ack_mask
    optimistic: true
    options:
      - Address 4 only
      - Mask 0x0010
      - Mask 0x0000
    initial_option: Address 4 only
    set_action:
      - lambda: |-
          if (x == "Mask 0x0010") {
            id(cec).set_ack_mask(0x0010);
          } else if (x == "Mask 0x0000") {
            id(cec).set_ack_mask(0x0000);
          } else {
            id(cec).clear_ack_mask();
          }

globals:
  - id: listener_other
    type: uint32_t
  - id: listener_own
    type: uint32_t
  - id: listener_polls
    type: uint32_t

esphome:
  on_boot:
    priority: 800
    then:
      - lambda: |-
          id(cec).add_frame_listener([](const hdmi_cec::Frame &frame, bool own) {
            if (frame.size() == 1) {
              id(listener_polls) += 1;
            }
            if (own) {
              id(listener_own) += 1;
            } else {
              id(listener_other) += 1;
            }
          });

interval:
  # Plan step 9b soak: Give Device Power Status to the TV every 2 s while the switch is on
  - interval: 2s
    then:
      - if:
          condition:
            switch.is_on: cec_tx_soak
          then:
            - hdmi_cec.send:
                destination: 0x0
                data: [0x8F]
  - interval: 10s
    then:
      - lambda: |-
          if (id(listener_other) + id(listener_own) == 0) {
            return;
          }
          ESP_LOGI("bench", "listener other=%" PRIu32 " own=%" PRIu32 " polls=%" PRIu32, id(listener_other), id(listener_own),
                   id(listener_polls));
          id(listener_other) = 0;
          id(listener_own) = 0;
          id(listener_polls) = 0;
