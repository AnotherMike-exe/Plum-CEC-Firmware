name: Review

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IDF_VERSION: v5.5

jobs:
  lint:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: |
          find main components -name '*.c' -o -name '*.h' \
            | xargs clang-format --dry-run --Werror

  build:
    name: ESP-IDF build (esp32c3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32c3
          path: .

  # TODO: add a test job once test/ holds host unit tests for pulse8 framing.

  claude-review:
    name: Automated review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # The secrets context is not allowed in a step `if`, so expose it through env.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: anthropics/claude-code-action@v1
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Review this PR for correctness, real-time safety (no blocking in the CEC path), security and adherence to the project's conventions in docs/CLAUDE.md."
