name: Review

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check the C++ format
        run: |
          find components -name '*.cpp' -o -name '*.h' \
            | xargs -r clang-format --dry-run --Werror

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Exit code 5 means that pytest found no tests. That is a pass until tests exist.
      - run: pytest scripts/ || [ $? -eq 5 ]

  host-test:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S test -B build/test
      - name: Build
        run: cmake --build build/test --parallel
      - name: Run the tests
        run: ctest --test-dir build/test --output-on-failure

  build:
    name: ESPHome compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .esphome
          key: esphome-${{ hashFiles('requirements.txt', 'PlumCec.yaml', 'components/**') }}
          restore-keys: esphome-
      - name: Write dummy secrets
        run: |
          cat > secrets.yaml <<YAML
          wifi_ssid: "CiNetwork"
          wifi_password: "CiPassword123"
          fallback_ap_password: "CiFallback123"
          api_key: "$(openssl rand -base64 32)"
          YAML
      - run: esphome compile PlumCec.yaml

  claude-review:
    name: Automated review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # The secrets context is not allowed in a step `if`, so expose it through env.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@e4a6faad497d33dbc7144135c75e41f82f0bf6c0 # v1
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Review this PR for correctness, real-time safety (no blocking in the CEC path), security and adherence to the project's conventions in docs/CLAUDE.md."
