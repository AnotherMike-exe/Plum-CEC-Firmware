# Dependabot version updates. Grouped, so one ecosystem opens one pull request a week.
# Keep only the ecosystems this project uses. Delete the rest.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
