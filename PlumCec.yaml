# Plum-CEC Adapter. The board package sets the chip and the pins.
# Secrets come from secrets.yaml (git-ignored). Copy secrets.example.yaml to start.

esphome:
  name: plum-cec
  friendly_name: Plum-CEC

esp32:
  framework:
    type: esp-idf
    sdkconfig_options:
      # The logger turns on the USB Serial/JTAG secondary console. Turn it off (invariant 1).
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: y
      CONFIG_ESP_CONSOLE_SECONDARY_USB_SERIAL_JTAG: n
      # The CEC TX and ACK timers run during flash writes, so their interrupts and the gptimer
      # calls in them must be in IRAM (plan step 9b)
      CONFIG_GPTIMER_ISR_IRAM_SAFE: y
      CONFIG_GPTIMER_CTRL_FUNC_IN_IRAM: y

external_components:
  - source:
      type: local
      path: components

packages:
  # The bench board: board_s3.yaml (ESP32-S3-DevKitC-1) or board_c3.yaml (retired C3 bench)
  board: !include packages/board_s3.yaml
  # M1 bench tests. Plan step 9c removes this package.
  m1_bench: !include packages/m1_bench.yaml
  timing_probe: !include packages/timing_probe.yaml
  gate_b: !include packages/gate_b.yaml

# UART0 only. USB Serial/JTAG (S3 GPIO19/20, C3 GPIO18/19) carries Pulse-Eight bytes (invariant 1).
logger:
  hardware_uart: UART0

# Pulse-Eight USB-CEC on USB Serial/JTAG. Step 8 runs it on a stub CEC bus.
pulse8:
  id: pulse8_usb

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The CEC path must not wait for a WiFi modem wake.
  power_save_mode: none
  ap:
    ssid: Plum-CEC Fallback
    password: !secret fallback_ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key

# OTA uses the API encryption key. It needs no password of its own.
ota:
  - platform: esphome
    encryption: {}

# Status LED: the on-board WS2812. It takes one RMT TX channel.
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: Status LED
    pin:
      number: ${led_pin}
      ignore_strapping_warning: ${led_pin_is_strap}
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
