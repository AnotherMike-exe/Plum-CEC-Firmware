# Plum-CEC Adapter on the ESP32-C3-DevKitC-02 bench board.
# Secrets come from secrets.yaml (git-ignored). Copy secrets.example.yaml to start.

esphome:
  name: plum-cec
  friendly_name: Plum-CEC

esp32:
  board: esp32-c3-devkitc-02
  framework:
    type: esp-idf
    sdkconfig_options:
      # The logger turns on the USB Serial/JTAG secondary console. Turn it off (invariant 1).
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: y
      CONFIG_ESP_CONSOLE_SECONDARY_USB_SERIAL_JTAG: n

external_components:
  - source:
      type: local
      path: components

# M1 bench tests. Plan step 9c removes this package.
packages:
  m1_bench: !include packages/m1_bench.yaml
  timing_probe: !include packages/timing_probe.yaml
  gate_b: !include packages/gate_b.yaml

# UART0 only. USB Serial/JTAG (GPIO18/19) carries Pulse-Eight bytes (invariant 1).
logger:
  hardware_uart: UART0

# Pulse-Eight USB-CEC on USB Serial/JTAG. Step 8 runs it on a stub CEC bus.
pulse8:
  id: pulse8_usb

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The CEC path must not wait for a WiFi modem wake.
  power_save_mode: none
  ap:
    ssid: Plum-CEC Fallback
    password: !secret fallback_ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key

# OTA uses the API encryption key. It needs no password of its own.
ota:
  - platform: esphome
    encryption: {}

# Status LED: the on-board WS2812 on GPIO8. It takes one RMT TX channel.
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: Status LED
    pin:
      number: GPIO8
      # GPIO8 is a strapping pin. The devkit wires the LED to it, and the LED does not pull it low.
      ignore_strapping_warning: true
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
